name: Pull request checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  go:
    uses: lukaszraczylo/shared-actions/.github/workflows/go-pr.yaml@main
    with:
      go-version: '>=1.24'
    secrets: inherit

  ui:
    name: UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npx --yes pnpm@11.21.0 install --frozen-lockfile
      - run: npx --yes pnpm@11.21.0 lint
      - run: npx --yes pnpm@11.21.0 typecheck
      - run: npx --yes pnpm@11.21.0 test
