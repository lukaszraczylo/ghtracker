apiVersion: v1
kind: ConfigMap
metadata:
  name: ghtracker
data:
  config.yaml: |
    listen: ":8080"
    refresh_interval: 6h
    github:
      app_id: 123456 # your GitHub App ID
      installation_id: 0
    thresholds:
      pr_warn_after: 48h
      pr_crit_after: 168h
      issue_stale_after: 720h
      workflow_stuck_after: 6h
    repos:
      - lukaszraczylo/kubemirror
      - lukaszraczylo/semver-generator
      - lukaszraczylo/traefikoidc
